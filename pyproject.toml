[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "comictagger-jp-talker"
version = "0.1.9"
description = "Japanese book metadata from NDL Search for ComicTagger 1.6"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["requests>=2.28,<3", "comictagger>=1.6.0b9,<1.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "ruff>=0.9", "comictagger[gui,cix]==1.6.0b9"]

[project.entry-points."comictagger.talker"]
jpbooks = "comictagger_jp_talker.talker:JapaneseBooksTalker"

[tool.setuptools.packages.find]
include = ["comictagger_jp_talker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: opt-in real NDL request", "gui: offscreen ComicTagger standard UI test"]

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = [".research", ".tools", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
