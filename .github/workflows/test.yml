name: Test and build
on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: '3.12'
          - os: ubuntu-24.04
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.14'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true

      - name: Verify Python security baseline
        run: python .github/scripts/verify-python-runtime.py '${{ matrix.python-version }}'

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1

      - name: Bootstrap secure pip
        shell: pwsh
        run: ./.github/scripts/bootstrap-pip.ps1

      - run: python -m pip install -e '.[dev]' 'certifi>=2026.10.19'

      - name: Verify Python packaging security
        run: python .github/scripts/verify-python-security.py --require-certifi

      - name: Check installed dependencies
        run: python -m pip check

      - name: Verify PyQt6 offscreen runtime
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from PyQt6 import QtCore, QtWidgets, uic; from comictaggerlib.autotagprogresswindow import AutoTagThread; app = QtWidgets.QApplication([]); print('PyQt6 offscreen OK')"

      - run: python -m ruff check .

      - run: python -m ruff format --check .

      - run: python -m pytest -m "not network"
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'

  build:
    runs-on: windows-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          check-latest: true

      - name: Verify Python security baseline
        run: python .github/scripts/verify-python-runtime.py 3.14

      - name: Bootstrap secure pip
        shell: pwsh
        run: ./.github/scripts/bootstrap-pip.ps1

      - name: Install build dependencies and package metadata
        shell: pwsh
        run: |
          python -m pip install build
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install build dependencies"
          }
          # Check tools before the intentionally dependency-free metadata install.
          python -m pip check
          if ($LASTEXITCODE -ne 0) {
            throw "Build dependency validation failed"
          }
          python -m pip install --no-deps -e .
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install package metadata"
          }

      - name: Verify Python packaging security
        run: python .github/scripts/verify-python-security.py

      - name: Get package version
        id: version
        shell: pwsh
        run: |
          $version = (python -c "from importlib.metadata import version; print(version('comictagger-jp-talker'))").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
            throw "Failed to determine package version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Get short commit SHA
        id: git
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}"
          if ($sha.Length -lt 7) {
            throw "Commit SHA must contain at least 7 characters"
          }
          $shortSha = $sha.Substring(0, 7)
          "short_sha=$shortSha" >> $env:GITHUB_OUTPUT

      - name: Build package
        run: python -m build

      - name: Build ComicTagger plugin
        id: plugin
        shell: pwsh
        run: |
          $wheels = @(Get-ChildItem -Path dist -Filter 'comictagger_jp_talker-*-py3-none-any.whl' -File)
          if ($wheels.Count -ne 1) {
            throw "Expected exactly one wheel, found $($wheels.Count)"
          }

          python scripts/build_plugin.py $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to build ComicTagger plugin"
          }

          $plugins = @(Get-ChildItem -Path dist -Filter 'jpbooks_talker-plugin-*.zip' -File)
          if ($plugins.Count -ne 1) {
            throw "Expected exactly one plugin ZIP, found $($plugins.Count)"
          }
          "path=$($plugins[0].FullName)" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v6
        with:
          name: comictagger-jp-talker-${{ steps.version.outputs.version }}-${{ steps.git.outputs.short_sha }}
          path: ${{ steps.plugin.outputs.path }}
